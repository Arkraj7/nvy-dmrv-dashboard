name: Weekly GSC Rank Tracker

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Export GSC search analytics
        env:
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          py scripts/gsc_rank_tracker.py --days 28 --top 30 --output data/gsc_ranks_latest.csv --json

      - name: Persist rank data
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git add data/gsc_ranks_latest.csv data/gsc_ranks_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No rank data changes."
            exit 0
          fi
          git commit -m "chore(seo): weekly GSC rank export ($(date -u +'%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase origin main || true
          done
          exit 1
