name: Link policy CI

# Runs on every push/PR: the official-link policy is enforced before merge.
# 1. pytest  : verify_link primitives + ingestion gate (invented fields rejected)
# 2. data guard : no blocklisted/aggregator URL in any published record
# 3. build + dist guard : job pages only link to apply host / employer site /
#    urbanforestpark.com, and no quarantined slug reaches HTML or sitemap.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: link-policy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Unit tests (verify_link + ingestion gate + lifecycle)
        run: python -m pytest tests -q

      - name: Data guard (no blocklisted hosts in published records)
        run: python scripts/link_guard.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Built-site guard (links + quarantined slugs)
        run: python scripts/link_guard.py --dist dist
