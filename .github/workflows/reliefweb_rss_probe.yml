name: ReliefWeb RSS probe

# Temporary manual-only probe: verifies the ReliefWeb source (v2 API attempt
# -> public RSS fallback) from a GitHub runner without running the full
# daily pipeline.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: pip install requests feedparser

      - name: Probe ReliefWeb source via the pipeline module
        run: |
          python - <<'PY'
          import logging
          import sys

          sys.path.insert(0, "scripts")
          logging.basicConfig(level=logging.INFO, format="%(levelname)-7s %(message)s")

          import fetch_and_humanize as fh

          fh.sanitize_ca_bundle_env()

          print("== v2 API attempt ==")
          v2 = fh.fetch_reliefweb_v2_jobs(fh.DEFAULT_RELIEFWEB_APPNAME)
          print("v2 result:", "None (will fall back)" if v2 is None else str(len(v2)) + " candidates")

          print("== RSS fallback ==")
          jobs = fh.fetch_reliefweb_rss_jobs()
          print("RESULT rss_candidates =", len(jobs))
          for job in jobs[:6]:
              print("RESULT", job["title"][:70], "|", job["organization"][:40], "|", job["date_posted"])
          print("RESULT all_urls_valid =", all(fh.is_valid_apply_url(j["apply_url"]) for j in jobs))
          PY
