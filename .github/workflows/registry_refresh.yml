name: Registry SEO Refresh

# Regenerates the static SEO surface (job detail pages, hub pages, badge
# counts, feeds) and deploys whenever a job is added directly to the registry
# through the Telegram intake bot (or any other commit that touches jobs.json).
# Keeps the live site in sync without waiting for the next daily pipeline run.

on:
  push:
    branches: [main]
    paths:
      - "public/jobs.json"
      - "public/global_jobs.json"

permissions:
  contents: write

concurrency:
  group: registry-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Rebuild SEO surface
        run: python scripts/build_seo_pages.py

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Commit regenerated SEO files
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git add public/ dist/ 2>/dev/null || true
          for f in public/jobs.json public/global_jobs.json public/stats.json public/sitemap.xml public/feed.xml public/jrf-feed.xml public/_redirects; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          find public/jobs -name '*.html' -print0 | xargs -0 git add 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] chore(seo): refresh after registry update ($(date -u +'%Y-%m-%d %H:%M'))"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt ${attempt} rejected; rebasing and retrying"
            git pull --rebase origin main || true
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.151.1 pages deploy dist --project-name=nvy-dmrv-dashboard --commit-dirty=true
