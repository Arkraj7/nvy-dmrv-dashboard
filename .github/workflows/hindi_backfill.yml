name: Hindi Backfill (manual)

# Manually (re)generate the bilingual metadata (title_hi / summary_hi) of the
# career registry. Default mode is idempotent: it only fills fields that are
# missing. Set force=true to re-translate every record through Gemini when
# quota allows — records fall back to the built-in deterministic glossary
# otherwise, so the run never fails for silence. The workflow rebuilds the
# static SEO surface (index snapshot, career-pathway hubs and the Hindi +
# regional multilingual portals) and redeploys the site so the refreshed
# metadata goes live immediately.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate every record (ignore existing Hindi fields)"
        type: boolean
        default: false
      limit:
        description: "Only process the first N records per file (blank = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: hindi-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Backfill Hindi metadata
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/backfill_hindi.py $ARGS

      - name: Rebuild static SEO pages (snapshot + hubs + multilingual portals)
        run: python scripts/build_seo_pages.py

      - name: Commit refreshed registry data
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git add public/jobs.json public/archive.json public/index.html \
                  public/jrf-srf-project-associate-jobs.html \
                  public/phd-fellowships-climate-sustainability.html \
                  public/forestry-wildlife-government-jobs.html \
                  public/gis-remote-sensing-climate-jobs.html \
                  public/esg-carbon-sustainability-jobs.html \
                  public/hindi-environment-forestry-jobs.html \
                  public/bharat-regional-green-jobs.html
          if git diff --cached --quiet; then
            echo "No bilingual changes - nothing to commit."
          else
            git commit -m "chore(i18n): Hindi bilingual metadata backfill"
            git pull --rebase --autostash
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build & deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
