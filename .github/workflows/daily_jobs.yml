name: Daily India Green Jobs Update

# Fetches new India climate/forestry/ESG/GIS/academic jobs every morning at
# 06:45 AM IST (01:15 UTC), humanizes them with Gemini, merges them into
# public/jobs.json, expires closed mandates into public/archive.json,
# refreshes public/stats.json (weekly hiring telemetry + IST run date),
# regenerates public/sitemap.xml, backfills bilingual (Hindi) metadata,
# refreshes the strictly separated global registry
# (public/global_jobs.json + public/global_archive.json), regenerates the
# weekly LinkedIn roundup files, rebuilds the static SEO surface, audits it
# with a job-level auto-sanitizer, commits the result and deploys the live
# site to Cloudflare Pages.
#
# A second 07:45 AM IST (02:15 UTC) watchdog run exits in seconds when the
# 06:45 run already completed both the pipeline and the Telegram broadcast.
# If GitHub drops or fails the first cron, the watchdog performs the full
# update instead. The logout is recorded in public/stats.json under
# last_pipeline_run_date_ist and last_telegram_broadcast_date.

on:
  schedule:
    # 06:45 AM IST == 01:15 UTC. Avoids GitHub's congested :00/:30 windows.
    - cron: "15 1 * * *"
    # 07:45 AM IST == 02:15 UTC. Backup/watchdog run, after the 37-minute
    # primary run has normally finished.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a full run even if today's pipeline and broadcast already succeeded"
        required: false
        default: false
        type: boolean

permissions:
  contents: write         # the bot commits registry + SEO page updates

concurrency:
  group: daily-jobs-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The watchdog must run before installing Python or scraping so the
      # backup invocation exits in seconds, not minutes.
      - name: "Watchdog: skip when today's run and broadcast already succeeded"
        id: watchdog
        shell: bash
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force requested - bypassing watchdog."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY_IST="$(TZ=Asia/Kolkata date +%F)"
          SKIP="$(python3 - "$TODAY_IST" <<'PY'
          import json
          import sys
          from pathlib import Path

          today = sys.argv[1]
          stats = {}
          try:
              stats = json.loads(Path("public/stats.json").read_text(encoding="utf-8"))
          except Exception:
              stats = {}
          run_done = str(stats.get("last_pipeline_run_date_ist") or "") == today
          broadcast_done = str(stats.get("last_telegram_broadcast_date") or "") == today
          print("true" if (run_done and broadcast_done) else "false")
          print(
              f"watchdog: IST={today} pipeline={run_done} broadcast={broadcast_done}",
              file=sys.stderr,
          )
          PY
          )"
          echo "watchdog skip=$SKIP for $TODAY_IST"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.watchdog.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        if: steps.watchdog.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Unit tests (verify_link + ingestion gate + digest rotation)
        if: steps.watchdog.outputs.skip != 'true'
        run: python -m pytest tests -q

      - name: Verify Telegram bot + channel (preflight)
        if: steps.watchdog.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Missing secrets are a safe no-op; a broken token or chat id fails
        # loudly before the pipeline runs.
        run: python scripts/verify_telegram.py --allow-missing

      - name: Fetch, humanize & publish green jobs
        if: steps.watchdog.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: "72"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_GROUP_URL: ${{ secrets.WHATSAPP_GROUP_URL }}
          # A manual force run bypasses only the once-per-day guard; the
          # rolling recent_telegram_job_ids exclusion still applies.
          FORCE_TELEGRAM_BROADCAST: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python scripts/fetch_and_humanize.py

      - name: Persist registry + broadcast rotation marker before the long build
        if: steps.watchdog.outputs.skip != 'true'
        # This small commit is the once-per-day safety net. If a later SEO
        # build or deploy fails, the backup cron must still see today's
        # last_telegram_broadcast_date and recent_telegram_job_ids, otherwise
        # it would resend the same ten jobs.
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git stash push --include-untracked -m "daily-marker-$(date -u +%s)" || true
          git pull --rebase origin main || true
          git stash pop || true
          git add public/jobs.json public/archive.json public/stats.json public/sitemap.xml \
                  public/daily_digest.json public/whatsapp_digest.txt \
                  public/global_jobs.json public/global_archive.json \
                  public/source_report.json
          for report in data/role_purge_report.json data/global_role_purge_report.json; do
            if [ -f "$report" ]; then
              git add "$report"
            fi
          done
          if git diff --cached --quiet; then
            echo "No registry changes to persist."
            exit 0
          fi
          # Cloudflare Pages must not auto-build these bot commits: the verified
          # Wrangler deploy below is the only production publisher.
          git commit -m "[CF-Pages-Skip] chore(jobs): persist daily registry + broadcast marker ($(date -u +'%Y-%m-%d'))"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "marker push attempt ${attempt} rejected; rebasing and retrying"
            git pull --rebase origin main || true
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::marker push failed after 3 attempts"
            exit 1
          fi

      - name: Backfill bilingual (Hindi) metadata for new mandates
        if: steps.watchdog.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Idempotent; never fails the run.
        run: python scripts/backfill_hindi.py

      - name: Refresh the weekly LinkedIn roundup files (build only)
        if: steps.watchdog.outputs.skip != 'true'
        run: python scripts/weekly_linkedin_post.py --dry-run

      - name: Rebuild static SEO pages (snapshot + hubs + multilingual portals + global hub)
        if: steps.watchdog.outputs.skip != 'true'
        run: python scripts/build_seo_pages.py

      - name: Audit and auto-sanitize job-level offenders (never blocks deploy)
        if: steps.watchdog.outputs.skip != 'true'
        # Link-policy and job-page offenders are quarantined (bounded to six)
        # and the SEO surface is rebuilt. Residual structural findings are
        # printed loudly but do not kill the Telegram broadcast/deploy.
        run: python scripts/audit_and_sanitize.py --stage data

      - name: Commit regenerated SEO pages + Hindi metadata
        if: steps.watchdog.outputs.skip != 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"

          # Pull any concurrent commit before staging. --include-untracked
          # protects generated Hindi/SEO files that are not yet tracked.
          git stash push --include-untracked -m "daily-pipeline-$(date -u +%s)" || true
          git pull --rebase origin main || true
          git stash pop || true

          git add public/jobs.json public/archive.json public/stats.json public/sitemap.xml \
                  public/daily_digest.json public/whatsapp_digest.txt \
                  public/global_jobs.json public/global_archive.json \
                  public/source_report.json \
                  public/linkedin_weekly_post.txt public/linkedin_weekly.json \
                  public/index.html public/feed.xml public/jrf-feed.xml \
                  public/jobs public/styles/job-page.css \
                  public/a9f3c2d7e8b14f60a2c5e9d3b7f14c68.txt \
                  public/jrf-srf-project-associate-jobs.html \
                  public/phd-fellowships-climate-sustainability.html \
                  public/forestry-wildlife-government-jobs.html \
                  public/gis-remote-sensing-climate-jobs.html \
                  public/esg-carbon-sustainability-jobs.html \
                  public/sustainability-jobs-india.html \
                  public/esg-jobs-for-freshers.html \
                  public/entry-level-environmental-jobs.html \
                  public/remote-environmental-jobs.html \
                  public/esg-sustainability-jobs-delhi-ncr.html \
                  public/esg-sustainability-jobs-karnataka.html \
                  public/esg-sustainability-jobs-maharashtra.html \
                  public/esg-jobs-bangalore.html \
                  public/esg-jobs-mumbai.html \
                  public/hindi-environment-forestry-jobs.html \
                  public/bharat-regional-green-jobs.html \
                  public/global-climate-sustainability-opportunities.html \
                  public/about.html public/404.html public/500.html \
                  public/seo_keyword_map.json \
                  scripts/seo_keyword_map.json scripts/hub_streak_state.json
          if [ -f data/role_purge_report.json ]; then
            git add data/role_purge_report.json
          fi
          if [ -f data/global_role_purge_report.json ]; then
            git add data/global_role_purge_report.json
          fi
          if git diff --cached --quiet; then
            echo "No registry changes today - nothing to commit."
            exit 0
          fi

          git commit -m "[CF-Pages-Skip] chore(seo): rebuild pages + Hindi metadata ($(date -u +'%Y-%m-%d'))"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "push attempt ${attempt} rejected; rebasing on origin/main and retrying"
            git pull --rebase origin main || true
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      - name: Set up Node.js
        if: steps.watchdog.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        if: steps.watchdog.outputs.skip != 'true'
        run: npm ci

      - name: Build site
        if: steps.watchdog.outputs.skip != 'true'
        run: npm run build

      - name: Guard the built site (links + quarantined slugs)
        if: steps.watchdog.outputs.skip != 'true'
        # Non-blocking by design. The data-stage sanitizer already removed
        # bounded job-level offenders; structural findings stay in the log for
        # review rather than killing the deploy.
        run: python scripts/audit_and_sanitize.py --stage dist --dist dist

      - name: Deploy to Cloudflare Pages
        if: steps.watchdog.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Explicit branch=main guarantees a production deployment even when
        # the bot commit via GITHUB_TOKEN does not trigger a Git integration.
        run: npx -y wrangler@4.151.1 pages deploy dist --project-name=nvy-dmrv-dashboard --branch=main --commit-dirty=true

      - name: Verify the live site received today's pipeline + broadcast
        if: steps.watchdog.outputs.skip != 'true'
        # Fails loudly after deploy if stats.json is stale, the Telegram
        # marker did not persist, or the rotation history is empty.
        run: python scripts/verify_live_update.py --attempts 8 --sleep 15

      - name: Submit updated URLs to IndexNow
        if: steps.watchdog.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/ping_search_engines.py

      - name: Alert Telegram on pipeline failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram alert skipped: secrets not configured."
            exit 0
          fi
          TEXT="⚠️ Urban Forest Park daily pipeline failed on $(TZ=Asia/Kolkata date +'%d %b %Y %H:%M IST'). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null || true
