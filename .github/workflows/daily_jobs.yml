name: Daily India Green Jobs Update

# Fetches new India climate/forestry/ESG/GIS/academic jobs every morning at
# 07:00 AM IST (01:30 UTC), humanizes them with Gemini, merges them into
# public/jobs.json, expires closed mandates into public/archive.json,
# refreshes public/stats.json (weekly hiring telemetry), regenerates
# public/sitemap.xml, backfills bilingual (Hindi) metadata for new mandates,
# refreshes the strictly separated global registry
# (public/global_jobs.json + public/global_archive.json),
# regenerates the weekly LinkedIn roundup files
# (public/linkedin_weekly_post.txt + public/linkedin_weekly.json - build
# only; the Monday email/publish lives in weekly_linkedin.yml),
# rebuilds the static SEO surface (the pre-rendered snapshot inside
# public/index.html, the five career-pathway hub pages, the two
# multilingual/regional portals and the Global opportunities hub),
# audits that surface for canonical, metadata, schema, crawl-graph and
# header regressions, commits them, and then builds + deploys the live
# site to Cloudflare Pages.

on:
  schedule:
    # 07:00 AM IST == 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # allows a manual run from the Actions tab

permissions:
  contents: write         # the bot commits registry + SEO page updates

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Unit tests (verify_link + ingestion gate)
        run: python -m pytest tests -q

      - name: Verify Telegram bot + channel (preflight)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Logs getMe / getChat / HTTP status / destination title. Missing
        # secrets are a safe no-op; a broken token or chat id fails loudly
        # before the pipeline runs, so the daily heartbeat never disappears
        # silently.
        run: python scripts/verify_telegram.py --allow-missing

      - name: Fetch, humanize & publish green jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: "72"
          # Optional automated broadcasting (safe no-ops when unset):
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_GROUP_URL: ${{ secrets.WHATSAPP_GROUP_URL }}
        run: python scripts/fetch_and_humanize.py

      - name: Backfill bilingual (Hindi) metadata for new mandates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Idempotent: fills title_hi / summary_hi only where missing, with
        # Gemini when the key/quota allows and the built-in glossary
        # otherwise. Never fails the run.
        run: python scripts/backfill_hindi.py

      - name: Refresh the weekly LinkedIn roundup files (build only)
        # Rebuilds public/linkedin_weekly_post.txt + .json so the registry
        # footer's "Copy Weekly LinkedIn Roundup (Top 10)" button always has
        # fresh content. --dry-run guarantees no email/publish happens here;
        # the Monday 09:00 IST dispatch runs in weekly_linkedin.yml.
        run: python scripts/weekly_linkedin_post.py --dry-run

      - name: Rebuild static SEO pages (snapshot + hubs + multilingual portals + global hub)
        run: python scripts/build_seo_pages.py

      - name: Audit the SEO surface (canonicals, metadata, schema, crawl graph, headers)
        # Fails the run before deploy if titles, descriptions, canonicals,
        # hreflang, JSON-LD, sitemap entries, internal links or headers drift.
        run: python scripts/seo_checklist_audit.py

      - name: Guard the official-link policy (data)
        # Fails before commit/deploy if a published record carries a job-board,
        # aggregator or news-wrapper URL, or lost its verification metadata.
        run: python scripts/link_guard.py

      - name: Commit updated registry data (jobs, archive, stats, global, sitemap, SEO pages)
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          # The deployed site root is public/, so the pipeline writes to
          # public/jobs.json, public/archive.json, public/stats.json,
          # public/sitemap.xml, public/daily_digest.json,
          # public/whatsapp_digest.txt, the strictly separated global
          # registry (public/global_jobs.json, public/global_archive.json)
          # and the weekly LinkedIn roundup files;
          # build_seo_pages.py rewrites public/index.html, the five
          # career-pathway hub pages, the two multilingual/regional portals
          # (Hindi hub + Bharat regional hub) and the Global hub page.
          git add public/jobs.json public/archive.json public/stats.json public/sitemap.xml \
                  public/daily_digest.json public/whatsapp_digest.txt \
                  public/global_jobs.json public/global_archive.json \
                  public/source_report.json data/role_purge_report.json \
                  data/global_role_purge_report.json \
                  public/linkedin_weekly_post.txt public/linkedin_weekly.json \
                  public/index.html public/feed.xml public/jrf-feed.xml \
                  public/jobs public/styles/job-page.css \
                  public/a9f3c2d7e8b14f60a2c5e9d3b7f14c68.txt \
                  public/jrf-srf-project-associate-jobs.html \
                  public/phd-fellowships-climate-sustainability.html \
                  public/forestry-wildlife-government-jobs.html \
                  public/gis-remote-sensing-climate-jobs.html \
                  public/esg-carbon-sustainability-jobs.html \
                  public/hindi-environment-forestry-jobs.html \
                  public/bharat-regional-green-jobs.html \
                  public/global-climate-sustainability-opportunities.html \
                  public/about.html public/404.html public/500.html \
                  public/seo_keyword_map.json
          if git diff --cached --quiet; then
            echo "No registry changes today - nothing to commit."
          else
            git commit -m "chore(jobs): daily registry update + SEO rebuild ($(date -u +'%Y-%m-%d'))"
            git pull --rebase --autostash
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Guard the built site (links + quarantined slugs)
        # Every outbound link must stay within the dossier, the employer's own
        # apply host / homepage, or urbanforestpark.com.
        run: python scripts/link_guard.py --dist dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.151.1 pages deploy dist --project-name=nvy-dmrv-dashboard --commit-dirty=true

      - name: Submit updated URLs to IndexNow
        # Post-deploy only: IndexNow verifies the live key file. Best-effort;
        # a search-engine outage must never roll back a successful deploy.
        continue-on-error: true
        run: python scripts/ping_search_engines.py
