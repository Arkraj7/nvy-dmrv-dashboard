name: Daily India Green Jobs Update

# Fetches new India climate/forestry/ESG/GIS jobs every morning at
# 07:00 AM IST (01:30 UTC), humanizes them with Gemini, merges them into
# public/jobs.json, expires closed mandates into public/archive.json,
# refreshes public/stats.json (weekly hiring telemetry), regenerates
# public/sitemap.xml, commits them, and then builds + deploys the live
# site to Cloudflare Pages.

on:
  schedule:
    # 07:00 AM IST == 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # allows a manual run from the Actions tab

permissions:
  contents: write         # the bot commits jobs.json + archive.json + stats.json + sitemap.xml

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch, humanize & publish green jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: "24"
        run: python scripts/fetch_and_humanize.py

      - name: Commit updated registry data (jobs, archive, stats, sitemap)
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          # The deployed site root is public/, so the pipeline writes to
          # public/jobs.json, public/archive.json, public/stats.json and
          # public/sitemap.xml.
          git add public/jobs.json public/archive.json public/stats.json public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No registry changes today - nothing to commit."
          else
            git commit -m "chore(jobs): daily registry update ($(date -u +'%Y-%m-%d'))"
            git pull --rebase --autostash
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build & deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
