name: Mandate Dispatch - 3-Day Email Newsletter

# Issues the subscriber email briefing (job & fellowship alerts) every third
# day at 08:00 AM IST (02:30 UTC). The mailer reads public/jobs.json, writes
# the web edition to public/newsletter_latest.html, delivers one personalised
# copy per subscriber through the first configured channel
# (RESEND_API_KEY -> BREVO_API_KEY -> SMTP_*), then commits the web edition
# and redeploys the site. With no email credentials configured it still
# regenerates the web edition and exits 0 - CI never fails for silence.
#
# Welcome emails
# --------------
# Every new subscriber receives the formal one-time onboarding email:
#   * instantly - functions/api/subscribe.js upserts the address into
#     data/subscribers.json through the GitHub Contents API and fires a
#     `welcome_email` repository_dispatch (GITHUB_PAT + GITHUB_REPO on the
#     Pages project), which runs `send_newsletter.py --welcome <email>` below;
#   * as a safety net - every scheduled run of the mailer welcomes any
#     subscriber in data/subscribers.json whose `welcome_sent` marker is
#     still missing.
# The manual "Run workflow" form also accepts a subscriber email (plus
# cadence/sector) for an ad-hoc welcome, or the test-welcome switch to mail
# the layout straight to SMTP_USER / NEWSLETTER_OWNER_EMAIL.
#
# Subscriber sources (merged and de-duplicated by scripts/send_newsletter.py):
#   data/subscribers.json       repository file (primary shared store),
#   NEWSLETTER_SUBSCRIBERS      JSON list secret, and/or
#   NEWSLETTER_SUBSCRIBERS_CSV  published-CSV URL secret (Google Sheet),
#   SMTP_USER                   owner copy of every dispatch.

on:
  schedule:
    # 08:00 AM IST == 02:30 UTC, every third day
    - cron: "30 2 */3 * *"
  workflow_dispatch:      # manual 1-click test, ad-hoc welcome, or full dispatch
    inputs:
      subscriber_email:
        description: "Persist + send the Welcome email now to this address (leave empty for a normal dispatch)"
        required: false
        type: string
        default: ""
      frequency:
        description: "Welcome email cadence stamp"
        required: false
        type: choice
        options: ["3-days", "weekly"]
        default: "3-days"
      sector:
        description: "Welcome email sector stamp"
        required: false
        type: choice
        options: ["all", "academic", "forestry-gis", "corporate-esg"]
        default: "all"
      test_welcome:
        description: "Send the Welcome email layout to SMTP_USER / NEWSLETTER_OWNER_EMAIL only"
        required: false
        type: boolean
        default: false
      force:
        description: "Force today's alert now (1-day window, then recent-job fallback)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [welcome_email]   # fired by functions/api/subscribe.js on a new subscription

permissions:
  contents: write         # the bot commits the dispatch web edition + subscribers

concurrency:
  group: newsletter-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate & deliver the job alert
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email == '' && !inputs.test_welcome) }}
        env:
          # Delivery channels - set whichever you use in repository secrets.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          NEWSLETTER_FROM_NAME: ${{ secrets.NEWSLETTER_FROM_NAME }}
          NEWSLETTER_OWNER_EMAIL: ${{ secrets.NEWSLETTER_OWNER_EMAIL }}
          # Subscriber sources (optional; the repository file is always read):
          NEWSLETTER_SUBSCRIBERS: ${{ secrets.NEWSLETTER_SUBSCRIBERS }}
          NEWSLETTER_SUBSCRIBERS_CSV: ${{ secrets.NEWSLETTER_SUBSCRIBERS_CSV }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/send_newsletter.py --force
          else
            python scripts/send_newsletter.py
          fi

      - name: Persist subscriber + deliver welcome email
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && (inputs.subscriber_email != '' || inputs.test_welcome)) }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM_EMAIL: ${{ secrets.NEWSLETTER_FROM_EMAIL }}
          NEWSLETTER_FROM_NAME: ${{ secrets.NEWSLETTER_FROM_NAME }}
          NEWSLETTER_OWNER_EMAIL: ${{ secrets.NEWSLETTER_OWNER_EMAIL }}
          WELCOME_EMAIL: ${{ inputs.subscriber_email || github.event.client_payload.subscriber_email || github.event.client_payload.email }}
          WELCOME_FREQ: ${{ inputs.frequency || github.event.client_payload.frequency || '3-days' }}
          WELCOME_SECTOR: ${{ inputs.sector || github.event.client_payload.sector || 'all' }}
        run: |
          if [ -n "$WELCOME_EMAIL" ]; then
            python scripts/send_newsletter.py --welcome "$WELCOME_EMAIL" \
              --frequency "${WELCOME_FREQ:-3-days}" \
              --sector "${WELCOME_SECTOR:-all}"
          else
            python scripts/send_newsletter.py --test-welcome
          fi

      - name: Commit the welcome subscriber
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email != '') }}
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git add data/subscribers.json
          if git diff --cached --quiet; then
            echo "No subscriber changes to commit."
          else
            git commit -m "chore(subscribers): persist welcome signup"
            git pull --rebase --autostash
            git push
          fi

      - name: Commit the dispatch web edition and subscriber store
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email == '' && !inputs.test_welcome) }}
        run: |
          git config user.name "urbanforestpark-bot"
          git config user.email "urbanforestpark-bot@users.noreply.github.com"
          git add public/newsletter_latest.html data/subscribers.json
          if git diff --cached --quiet; then
            echo "No dispatch changes to commit."
          else
            git commit -m "chore(newsletter): refresh job alert web edition ($(date -u +'%Y-%m-%d'))"
            git pull --rebase --autostash
            git push
          fi

      - name: Set up Node.js
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email == '' && !inputs.test_welcome) }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install site dependencies
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email == '' && !inputs.test_welcome) }}
        run: npm ci

      - name: Build & deploy to Cloudflare Pages
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subscriber_email == '' && !inputs.test_welcome) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
