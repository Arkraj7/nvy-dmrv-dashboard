name: Link Audit — verify_link over all records

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev libxml2-dev libxslt1-dev zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber certifi lxml

      - name: Debug Python environment
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import bs4; print('beautifulsoup4:', bs4.__version__)"
          python -c "import pdfplumber; print('pdfplumber:', pdfplumber.__version__)"
          python -c "import certifi; print('certifi:', certifi.where())"
          python -c "import lxml; print('lxml:', lxml.__version__)"

      - name: Test basic connectivity
        run: python scripts/test_connect.py

      - name: Run link audit
        run: python scripts/audit_links.py 2>&1
        shell: bash
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.csv
          retention-days: 30

      - name: Print summary
        if: always()
        run: python scripts/print_summary.py
        shell: bash