name: Link Audit — verify_link over all records

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber certifi

      - name: Run link audit
        run: python scripts/audit_links.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.csv
          retention-days: 30

      - name: Print summary
        run: |
          echo "=== AUDIT SUMMARY ==="
          python3 -c "
import csv
with open('audit_report.csv') as f:
    reader = csv.DictReader(f)
    rows = list(reader)
print(f'Total: {len(rows)}')
print(f'PASS: {sum(1 for r in rows if r[\"verdict\"] == \"PASS\")}')
print(f'FAIL: {sum(1 for r in rows if r[\"verdict\"] == \"FAIL\")}')
print(f'HTTP 200: {sum(1 for r in rows if r[\"http_status\"] == \"200\")}')
from collections import Counter
rc = Counter(r['reason_code'] for r in rows)
print('Reason codes:', dict(rc.most_common()))
et = Counter(r['entry_type'] for r in rows)
print('Entry types:', dict(et.most_common()))
hc = Counter(r['final_host'] for r in rows if r['final_host'])
print('Top hosts:', dict(hc.most_common(10)))
"