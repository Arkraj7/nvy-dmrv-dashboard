name = "nvy-dmrv-dashboard"
pages_build_output_dir = "dist"

# GITHUB_PAT is an encrypted Pages secret, not a committed var:
#   wrangler pages secret put GITHUB_PAT --project-name=nvy-dmrv-dashboard
# Secrets survive direct `wrangler pages deploy` uploads; plain dashboard-only
# variables do not. GITHUB_REPO is non-sensitive and lives here.
[vars]
GITHUB_REPO = "Arkraj7/nvy-dmrv-dashboard"
# SHA-256 of the Syndication Desk passphrase. This is a server-side gate for
# /api/parse_flyer and /api/commit_job; it is not the passphrase itself.
SYNDICATION_PASSPHRASE_SHA256 = "358dc445f18f1c5a6f13af6aba6e7fdad57d541b14264c572978b27f862462e2"
